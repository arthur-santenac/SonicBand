name: CI

permissions:
  contents: read

on:
  push:
    branches: ['**']

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/SonicBandFront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/SonicBandFront/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le formatage (Prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .