{% extends 'core/base.html' %}
{% block contenu %}
<div class="columns is-centered">
    <div class="column is-5">
        <div class="box mt-5">
            <h1 class="title has-text-centered">Connexion</h1>
            <form action="" method="post">
                {% csrf_token %}
                <!-- Affiche le formulaire généré par Django -->
                {{ form.as_p }}
                <div class="field mt-5">
                    <div class="control">
                        <button class="button is-info is-fullwidth">Se connecter</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
